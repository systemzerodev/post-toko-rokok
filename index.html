<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>POS Toko Rokok</title>

    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <header>
      <h1>POS TOKO ROKOK</h1>
      <p>Kasir Sederhana</p>
    </header>

    <main>
      <section class="search-section">
        <input type="text" placeholder="Cari produk..." />
      </section>

      <section class="pos-container">
        <section class="products">
          <h2>Produk</h2>

          <div class="product-grid">
            <button class="product-card">
              <div class="product-image"></div>

              <span class="product-name"> Surya Pro </span>

              <span class="product-price"> Rp38.000 </span>
            </button>

            <button class="product-card">
              <div class="product-image"></div>

              <span class="product-name"> GG Merah </span>

              <span class="product-price"> Rp30.000 </span>
            </button>

            <button class="product-card">
              <div class="product-image"></div>

              <span class="product-name"> Esse Berry </span>

              <span class="product-price"> Rp34.000 </span>
            </button>
          </div>
        </section>

        <section class="cart">
          <h2>Keranjang</h2>

          <ul class="cart-items"></ul>

          <p class="empty-cart">Belum ada item</p>

          <div class="cart-summary">
            <p>Total: Rp0</p>

            <button class="checkout-btn">Bayar</button>
          </div>
        </section>
      </section>
    </main>

    <div class="modal-overlay">
      <div class="modal">
        <h2>Surya Pro</h2>

        <div class="form-group">
          <label>Satuan</label>

          <select>
            <option>Batang</option>
            <option>Bungkus</option>
          </select>
        </div>

        <div class="form-group">
          <label>Jumlah</label>

          <input type="number" min="1" value="1" />
        </div>

        <div class="modal-actions">
          <button>Batal</button>
          <button>Tambah</button>
        </div>
      </div>
    </div>
  </body>
</html>
